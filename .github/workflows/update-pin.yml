name: Update CLI pin

on:
  repository_dispatch:
    types: [cli-published]
  schedule:
    - cron: '17 6 * * *'   # daily fallback: pins npm `latest` if a dispatch was missed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin (empty = latest on npm; use for rollback too)'
        required: false

permissions:
  contents: write

concurrency:
  group: update-pin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cachix/install-nix-action installs upstream Nix. Do NOT use
      # DeterminateSystems/nix-installer-action: it installs Determinate Nix by
      # default and dropped upstream-Nix support on 2026-01-01.
      - uses: cachix/install-nix-action@v31

      - name: Run update.sh (retry for npm registry propagation)
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version || '' }}
        run: |
          for i in 1 2 3 4 5; do
            if [ -n "$VERSION" ]; then
              ./update.sh "$VERSION" && exit 0
            else
              ./update.sh && exit 0
            fi
            echo "attempt $i failed (tarball may not have propagated yet); retrying in 60s"
            sleep 60
          done
          echo "::error::update.sh failed after 5 attempts"
          exit 1

      - name: Verify pin matches the dispatched version
        if: github.event_name == 'repository_dispatch'
        run: |
          EXPECTED="${{ github.event.client_payload.version }}"
          ACTUAL=$(sed -n 's/^ *version = "\(.*\)";/\1/p' flake.nix | head -1)
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::pinned ${ACTUAL} but the publish dispatched ${EXPECTED}"
            exit 1
          fi

      - name: Exit early if nothing changed
        id: diff
        run: |
          if git diff --quiet flake.nix package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and smoke-test
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix build .#default
          ./result/bin/machine0 --version
          ./result/bin/machine0 --help

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          VERSION=$(sed -n 's/^ *version = "\(.*\)";/\1/p' flake.nix | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix package-lock.json
          git commit -m "pin @machine0/cli@${VERSION}"
          git push
